name: Nginx Restart

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  restart-nginx:
    runs-on: ubuntu-latest

    steps:
      - name: ssh remote deploy
        uses: fifsky/ssh-action@master
        with:
          command: |
            echo -e "pull conf"
            cd /root/nginx/nginx
            pwd
            ls
            git pull origin main
            echo -e "pull conf done"

            echo -e "copy conf and html to host"
            mkdir -p /root/nginx
            rm -rf /root/nginx/nginx-conf /root/nginx/nginx-html /root/nginx/docker || true
            cp -a nginx-conf /root/nginx/
            cp -a nginx-html /root/nginx/
            cp -a docker /root/nginx/
            echo -e "copy conf and html to host done"

            echo -e "restart nginx"
            # 指定 docker-compose 文件路径并先停止上次运行的服务
            docker-compose -f /root/nginx/docker/docker-compose.yml version || true
            docker-compose -f /root/nginx/docker/docker-compose.yml down || true
            # 以防有残留命名为 nginx 的容器，尝试停止
            docker ps -aq --filter "name=nginx" | xargs -r docker stop || true
            # 重新以指定 compose 文件启动，-f 指定文件，-d 后台运行，--remove-orphans
            docker-compose -f /root/nginx/docker/docker-compose.yml up -d --remove-orphans
            echo -e "restart nginx done"

          host: ${{ secrets.HOST }}
          user: ${{ secrets.USER }}
          pass: ${{ secrets.PASSWORD }}
