version: "3"

services:
  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /root/nginx/nginx-conf/conf.d:/etc/nginx/conf.d
      - /root/nginx/nginx-conf/nginx.conf:/etc/nginx/nginx.conf
      - /root/nginx/nginx-conf/mime.types:/etc/nginx/mime.types
      - /root/nginx/nginx-html:/usr/share/nginx
      - /root/nginx/log:/var/log/nginx
    restart: unless-stopped
