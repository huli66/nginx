server {
    listen 443 ssl;
    server_name  huli66.com www.huli66.com;

    ssl_certificate          /etc/nginx/conf.d/ssl/huli66.com.pem;
    ssl_certificate_key      /etc/nginx/conf.d/ssl/huli66.com.key;

    ssl_session_timeout  5m;

    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_protocols SSLv3 TLSv1 TLSv1.1 TLSv1.2;
    ssl_prefer_server_ciphers   on;

    location / {
        proxy_pass http://huli66.com:3000;
        root   /usr/share/nginx/html;
        index  index.html index.htm;
    }
}